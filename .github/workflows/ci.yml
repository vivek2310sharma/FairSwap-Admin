name: Admin foundation CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Admin quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10.12.1'
          run_install: false
          cache: false
      - name: Verify toolchain versions and source revision
        run: |
          node --version
          pnpm --version
          test "$(node --version)" = "v24.15.0"
          test "$(pnpm --version)" = "10.12.1"
          git rev-parse HEAD
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint with zero warnings
        run: pnpm lint
      - name: Run foundation unit tests
        run: pnpm test:unit
      - name: Build disabled foundation
        run: pnpm build
